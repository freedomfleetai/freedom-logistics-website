<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" role="img" aria-label="Intermodal chassis with container">
  <!-- container -->
  <rect x="56" y="40" width="188" height="58" rx="2" fill="#EEF3FB" stroke="#0D2B5E" stroke-width="3"/>
  <g stroke="#CBD7E5" stroke-width="2"><line x1="92" y1="44" x2="92" y2="94"/><line x1="128" y1="44" x2="128" y2="94"/><line x1="164" y1="44" x2="164" y2="94"/><line x1="200" y1="44" x2="200" y2="94"/></g>
  <!-- twist locks -->
  <g fill="#BA3440"><rect x="56" y="95" width="7" height="7"/><rect x="237" y="95" width="7" height="7"/></g>
  <!-- chassis rail -->
  <rect x="40" y="102" width="222" height="9" fill="#0D2B5E"/>
  <!-- rear tandem wheels -->
  <circle cx="198" cy="128" r="15" fill="#2B3340"/><circle cx="198" cy="128" r="6" fill="#AEB9C7"/>
  <circle cx="230" cy="128" r="15" fill="#2B3340"/><circle cx="230" cy="128" r="6" fill="#AEB9C7"/>
  <!-- front support legs -->
  <rect x="72" y="111" width="7" height="20" fill="#0D2B5E"/>
  <rect x="88" y="111" width="7" height="20" fill="#0D2B5E"/>
</svg>
