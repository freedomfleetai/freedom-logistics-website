<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Placeholder: light enterprise fleet yard with parked dry van trailers, rear doors and tandem wheels visible">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F7FC"/>
      <stop offset="1" stop-color="#DCE7F2"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2DCE7"/>
      <stop offset="1" stop-color="#B9C6D5"/>
    </linearGradient>
    <linearGradient id="vanA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EFF3F9"/>
      <stop offset="1" stop-color="#D9E2ED"/>
    </linearGradient>
    <linearGradient id="vanDoors" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF3F9"/>
      <stop offset="1" stop-color="#D4DEEA"/>
    </linearGradient>
    <radialGradient id="tire" cx="0.4" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#3C4651"/>
      <stop offset="1" stop-color="#1E252D"/>
    </radialGradient>
    <radialGradient id="grndshadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7E8FA4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7E8FA4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- distant warehouse / DC, atmospheric (lighter = farther) -->
  <rect x="0" y="250" width="1200" height="120" fill="#E4ECF4"/>
  <rect x="0" y="250" width="1200" height="8" fill="#D7E1EC"/>
  <g fill="#D2DEEB" opacity="0.9">
    <rect x="60" y="276" width="150" height="86"/>
    <rect x="230" y="276" width="150" height="86"/>
    <rect x="400" y="276" width="150" height="86"/>
    <rect x="820" y="276" width="150" height="86"/>
    <rect x="990" y="276" width="150" height="86"/>
  </g>

  <!-- row of parked trailers in back (smaller, lighter = perspective) -->
  <g opacity="0.92">
    <g fill="#E8EEF5" stroke="#D3DDEA" stroke-width="1.5">
      <rect x="120" y="330" width="150" height="86" rx="3"/>
      <rect x="285" y="330" width="150" height="86" rx="3"/>
      <rect x="450" y="330" width="150" height="86" rx="3"/>
      <rect x="700" y="332" width="150" height="84" rx="3"/>
      <rect x="865" y="332" width="150" height="84" rx="3"/>
    </g>
    <!-- faint door splits on back row -->
    <g stroke="#CBD7E5" stroke-width="1.5">
      <line x1="195" y1="338" x2="195" y2="408"/>
      <line x1="360" y1="338" x2="360" y2="408"/>
      <line x1="525" y1="338" x2="525" y2="408"/>
      <line x1="775" y1="340" x2="775" y2="408"/>
      <line x1="940" y1="340" x2="940" y2="408"/>
    </g>
  </g>

  <!-- asphalt -->
  <rect x="0" y="416" width="1200" height="384" fill="url(#asphalt)"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#A9B8C9" stroke-width="3" stroke-dasharray="34 26" opacity="0.6"/>
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#A9B8C9" stroke-width="2" stroke-dasharray="30 28" opacity="0.4"/>

  <!-- ground shadow under foreground trailer -->
  <ellipse cx="660" cy="650" rx="430" ry="38" fill="url(#grndshadow)"/>

  <!-- ============ FOREGROUND DRY VAN (clean, no tractor, no service truck) ============ -->
  <g>
    <!-- box body -->
    <rect x="320" y="396" width="600" height="244" rx="8" fill="url(#vanA)" stroke="#C2CEDD" stroke-width="2"/>
    <rect x="320" y="396" width="600" height="13" rx="8" fill="#FFFFFF"/>
    <rect x="322" y="606" width="596" height="32" fill="#D6E0EB" opacity="0.65"/>
    <!-- side seams -->
    <g stroke="#E7EDF5" stroke-width="2">
      <line x1="398" y1="412" x2="398" y2="636"/>
      <line x1="486" y1="412" x2="486" y2="636"/>
      <line x1="574" y1="412" x2="574" y2="636"/>
      <line x1="662" y1="412" x2="662" y2="636"/>
      <line x1="750" y1="412" x2="750" y2="636"/>
    </g>

    <!-- rear doors -->
    <rect x="806" y="402" width="112" height="234" rx="6" fill="#C7D3E1"/>
    <rect x="813" y="407" width="104" height="224" rx="5" fill="url(#vanDoors)" stroke="#C2CEDD" stroke-width="2"/>
    <line x1="865" y1="413" x2="865" y2="625" stroke="#C2CEDD" stroke-width="3"/>
    <line x1="836" y1="420" x2="836" y2="618" stroke="#9AACC2" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="894" y1="420" x2="894" y2="618" stroke="#9AACC2" stroke-width="4.5" stroke-linecap="round"/>
    <g fill="#8597AE"><rect x="916" y="430" width="6" height="18" rx="2"/><rect x="916" y="512" width="6" height="18" rx="2"/><rect x="916" y="594" width="6" height="18" rx="2"/></g>
    <rect x="846" y="500" width="12" height="44" rx="3" fill="#74879F"/>
    <rect x="872" y="500" width="12" height="44" rx="3" fill="#74879F"/>

    <!-- underframe -->
    <rect x="342" y="640" width="540" height="15" fill="#94A6BC"/>

    <!-- tandem wheels at rear, near the doors -->
    <g>
      <rect x="794" y="655" width="15" height="48" fill="#262E37"/>
      <rect x="690" y="655" width="184" height="19" rx="4" fill="#74879F"/>
      <circle cx="728" cy="694" r="39" fill="url(#tire)"/>
      <circle cx="728" cy="694" r="17" fill="#B4C0D0"/>
      <circle cx="728" cy="694" r="6" fill="#869ab2"/>
      <circle cx="830" cy="694" r="39" fill="url(#tire)"/>
      <circle cx="830" cy="694" r="17" fill="#B4C0D0"/>
      <circle cx="830" cy="694" r="6" fill="#869ab2"/>
    </g>

    <!-- landing gear -->
    <rect x="398" y="655" width="15" height="52" fill="#94A6BC"/>
    <rect x="432" y="655" width="15" height="52" fill="#94A6BC"/>
    <rect x="392" y="705" width="62" height="9" rx="3" fill="#8597AE"/>
  </g>
</svg>
