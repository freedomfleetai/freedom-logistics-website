<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Placeholder: light distribution-center yard with a clean dry van trailer, rear doors and tandem wheels visible">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#EAF0F7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EDF4"/>
      <stop offset="1" stop-color="#D8E1EC"/>
    </linearGradient>
  </defs>

  <!-- sky / yard -->
  <rect width="1200" height="700" fill="url(#sky)"/>
  <!-- distribution center building band -->
  <rect x="0" y="250" width="1200" height="120" fill="#EDF2F8"/>
  <g fill="#DCE6F1">
    <rect x="120" y="270" width="90" height="80"/>
    <rect x="230" y="270" width="90" height="80"/>
    <rect x="340" y="270" width="90" height="80"/>
    <rect x="900" y="270" width="90" height="80"/>
    <rect x="1010" y="270" width="90" height="80"/>
  </g>
  <!-- dock doors -->
  <g fill="#C6D4E4">
    <rect x="130" y="300" width="70" height="50"/>
    <rect x="240" y="300" width="70" height="50"/>
    <rect x="350" y="300" width="70" height="50"/>
  </g>

  <!-- ground -->
  <rect x="0" y="370" width="1200" height="330" fill="url(#ground)"/>
  <!-- lane markings -->
  <g stroke="#C3CFDD" stroke-width="3" stroke-dasharray="26 22" opacity="0.7">
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- ===== Dry van trailer (clean, light) ===== -->
  <g>
    <!-- shadow -->
    <ellipse cx="640" cy="592" rx="430" ry="20" fill="#B9C6D6" opacity="0.5"/>

    <!-- trailer box body -->
    <rect x="300" y="300" width="640" height="230" rx="6" fill="#FFFFFF" stroke="#C7D2E0" stroke-width="3"/>
    <!-- top rail -->
    <rect x="300" y="300" width="640" height="14" rx="6" fill="#EEF3FB"/>
    <!-- side panel seams -->
    <g stroke="#E4EAF2" stroke-width="2">
      <line x1="370" y1="318" x2="370" y2="526"/>
      <line x1="470" y1="318" x2="470" y2="526"/>
      <line x1="570" y1="318" x2="570" y2="526"/>
      <line x1="670" y1="318" x2="670" y2="526"/>
      <line x1="770" y1="318" x2="770" y2="526"/>
      <line x1="855" y1="318" x2="855" y2="526"/>
    </g>

    <!-- REAR DOORS (right end) -->
    <rect x="855" y="306" width="85" height="218" rx="4" fill="#F4F7FB" stroke="#C7D2E0" stroke-width="3"/>
    <!-- door split -->
    <line x1="897" y1="312" x2="897" y2="518" stroke="#C7D2E0" stroke-width="3"/>
    <!-- vertical lock rods -->
    <line x1="872" y1="320" x2="872" y2="510" stroke="#9FB1C6" stroke-width="4" stroke-linecap="round"/>
    <line x1="922" y1="320" x2="922" y2="510" stroke="#9FB1C6" stroke-width="4" stroke-linecap="round"/>
    <!-- door handles -->
    <rect x="884" y="405" width="10" height="34" rx="3" fill="#7E91A8"/>
    <rect x="900" y="405" width="10" height="34" rx="3" fill="#7E91A8"/>

    <!-- under-trailer frame -->
    <rect x="320" y="530" width="600" height="16" fill="#9FB1C6"/>

    <!-- TANDEM WHEELS at the rear, near the doors -->
    <g>
      <!-- bogie -->
      <rect x="740" y="540" width="170" height="20" rx="4" fill="#7E91A8"/>
      <!-- wheel 1 -->
      <circle cx="775" cy="575" r="34" fill="#2B3340"/>
      <circle cx="775" cy="575" r="15" fill="#AEB9C7"/>
      <!-- wheel 2 (tandem) -->
      <circle cx="865" cy="575" r="34" fill="#2B3340"/>
      <circle cx="865" cy="575" r="15" fill="#AEB9C7"/>
    </g>

    <!-- landing gear (front support, no tractor) -->
    <rect x="360" y="546" width="14" height="46" fill="#9FB1C6"/>
    <rect x="392" y="546" width="14" height="46" fill="#9FB1C6"/>
  </g>

  <!-- subtle placeholder label -->
  <text x="600" y="660" text-anchor="middle" font-family="'DM Sans',Arial,sans-serif" font-size="15" letter-spacing="2" fill="#9AA9BC">PLACEHOLDER — REPLACE WITH LIGHT FLEET-YARD PHOTO</text>
</svg>
